<div class="w-lg-480">
  <!-- <h2 mat-dialog-title>Confirm Edit Action</h2> -->
  <mat-dialog-content class="mat-typography">
    <div class="w-100">
      <div class="w-15 float-left">
        <div class="mt-lg-10 mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-red-100 sm:mx-0 sm:h-10 sm:w-10">
          <svg class="h-6 w-6 text-red-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
      </div>
      <div class="w-80 float-right">
        <div class="mt-3 sm:mt-0 sm:ml-4 sm:text-left">
          <h3 class="text-lg leading-6 font-medium text-gray-900 mb-2">
            Edit order
          </h3>
          <div class="mt-2 w-100 pr-2">
            <p class="text-gray-500">
              Are you sure you want to edit the order? All your changes will be permanently saved. This action cannot be undone
            </p>
          </div>
        </div>
      </div>
    </div>

  </mat-dialog-content>
  <mat-dialog-actions align="end" class="bg-gray-50 px-4 py-3 sm:px-6">
    <button mat-button mat-dialog-close
      class="border-light-cm hover-dim mr-2 rounded-md mr-2 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">Cancel</button>
    <button mat-button [mat-dialog-close]="true" cdkFocusInitial
      class="rounded-md border border-transparent shadow-sm px-4 py-2 bg-red-600 text-base font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 sm:ml-3 sm:w-auto sm:text-sm">Confirm</button>
  </mat-dialog-actions>
</div>
